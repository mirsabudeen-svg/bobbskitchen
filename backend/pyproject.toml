[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["app/db/migrations/versions", "venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["B008"]  # FastAPI Depends() in defaults is idiomatic

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
check_untyped_defs = true
exclude = "app/db/migrations/"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
