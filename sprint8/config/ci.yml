name: Sprint 8 — Pilot Simulation & Hardening

on:
  push:
    branches: [main, sprint-8]
  pull_request:
    branches: [main]

env:
  TEST_DATABASE_URL: postgresql+asyncpg://bobb:bobb@localhost:5432/bobb_test
  PYTHONPATH: .

jobs:
  # -------------------------------------------------------------------------
  # Unit + Integration: Load, Simulation, Staff
  # (These run against the ASGITransport test client — no Docker needed)
  # -------------------------------------------------------------------------
  test-core:
    name: Core Tests (Load · Simulation · Staff)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: bobb
          POSTGRES_PASSWORD: bobb
          POSTGRES_DB: bobb_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx anyio asyncpg \
                      sqlalchemy[asyncio] alembic faker websockets \
                      locust psutil

      - name: Run Alembic migrations on test DB
        run: alembic upgrade head
        env:
          DATABASE_URL: postgresql+asyncpg://bobb:bobb@localhost:5432/bobb_test

      - name: Run load tests
        run: pytest tests/load/test_load.py -v -s --timeout=120 -m "not recovery"

      - name: Run Saturday simulation
        run: pytest tests/simulation/ -v -s --timeout=300

      - name: Run staff workflow tests
        run: pytest tests/staff/ -v --timeout=60

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-core
          path: |
            .pytest_cache/
            test-results.xml

  # -------------------------------------------------------------------------
  # Locust headless load test
  # -------------------------------------------------------------------------
  locust-headless:
    name: Locust Sustained Load (60s)
    runs-on: ubuntu-latest
    needs: test-core

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: bobb
          POSTGRES_PASSWORD: bobb
          POSTGRES_DB: bobb_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install locust faker

      - name: Run Alembic migrations
        run: alembic upgrade head
        env:
          DATABASE_URL: postgresql+asyncpg://bobb:bobb@localhost:5432/bobb_test

      - name: Start API in background
        run: |
          uvicorn app.main:app --host 0.0.0.0 --port 8000 &
          sleep 3
        env:
          DATABASE_URL: postgresql+asyncpg://bobb:bobb@localhost:5432/bobb_test

      - name: Run Locust headless (10 users, 60 seconds)
        run: |
          locust -f tests/load/locustfile.py \
            --host http://localhost:8000 \
            --users 10 \
            --spawn-rate 2 \
            --run-time 60s \
            --headless \
            --html reports/locust_ci.html \
            --exit-code-on-error 1

      - name: Upload Locust report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: locust-report
          path: reports/locust_ci.html

  # -------------------------------------------------------------------------
  # Recovery tests — Docker Compose (manual/scheduled only, not on PR)
  # -------------------------------------------------------------------------
  test-recovery:
    name: Recovery Tests (Docker Compose)
    runs-on: ubuntu-latest
    needs: test-core
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx anyio websockets faker psutil

      - name: Start full Docker Compose stack
        run: |
          docker compose -p bobb up -d --wait
          sleep 5

      - name: Run Alembic migrations
        run: |
          docker compose -p bobb exec api alembic upgrade head

      - name: Run recovery tests
        run: |
          pytest tests/recovery/ -v -s --timeout=120
        env:
          TEST_API_URL: http://localhost:8000
          TEST_WS_URL:  ws://localhost:8000
          COMPOSE_PROJECT: bobb

      - name: Collect Docker logs on failure
        if: failure()
        run: |
          docker compose -p bobb logs --tail=100

      - name: Tear down stack
        if: always()
        run: docker compose -p bobb down -v
