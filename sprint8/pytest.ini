# sprint8/pytest.ini
[pytest]
asyncio_mode = auto
testpaths = tests
timeout = 120
markers =
    load: Load and concurrency tests (may be slow)
    simulation: Full Saturday simulation
    staff: Staff workflow and queue tests
    recovery: Infrastructure recovery tests (requires Docker)
filterwarnings =
    ignore::DeprecationWarning
    ignore::pytest.PytestUnraisableExceptionWarning
log_cli = true
log_cli_level = INFO
