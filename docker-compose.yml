services:
  postgres:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: bobb
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bobb}
      POSTGRES_DB: bobb
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bobb -d bobb"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://bobb:${POSTGRES_PASSWORD:-bobb}@postgres:5432/bobb
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      FAL_API_KEY: ${FAL_API_KEY:-}
      IMAGE_GEN_PROVIDER: ${IMAGE_GEN_PROVIDER:-fal}
      # WhatsApp / Twilio (Sprint 9) — leave blank to disable
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_WHATSAPP_FROM: ${TWILIO_WHATSAPP_FROM:-whatsapp:+14155238886}
      TWILIO_TEMPLATE_SID_EN: ${TWILIO_TEMPLATE_SID_EN:-}
      TWILIO_TEMPLATE_SID_ML: ${TWILIO_TEMPLATE_SID_ML:-}
      # Public base URL for WhatsApp image links (must be HTTPS and reachable by Meta)
      PUBLIC_MEDIA_BASE_URL: ${PUBLIC_MEDIA_BASE_URL:-}
      CACHE_DIR: /app/cache/designs
      DEBUG: ${DEBUG:-false}
      PORT: "8420"
    volumes:
      - designs_cache:/app/cache/designs
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8420 --workers 1"

  frontend:
    build:
      context: ./frontend
      args:
        # Baked into the static bundle at build time.
        # In production behind nginx, /api and /ws are proxied — use relative URL.
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
    restart: unless-stopped
    depends_on:
      - backend

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - designs_cache:/app/cache/designs:ro
    depends_on:
      - backend
      - frontend

  # Cloudflare Tunnel — zero-config HTTPS, no open inbound ports required.
  # To enable:
  #   1. Go to https://one.dash.cloudflare.com → Networks → Tunnels → Create tunnel
  #   2. Copy the tunnel token and set CLOUDFLARE_TUNNEL_TOKEN in your .env
  #   3. In the tunnel dashboard, add a Public Hostname:
  #        Subdomain: <your-subdomain>   Domain: <your-zone>
  #        Service:   http://nginx:80
  # Leave CLOUDFLARE_TUNNEL_TOKEN blank to skip (tunnel container won't start).
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      - nginx
    profiles:
      - tunnel

volumes:
  pgdata:
  designs_cache:
