services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: bobb
      POSTGRES_PASSWORD: bobb
      POSTGRES_DB: bobb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bobb -d bobb"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    ports:
      - "8420:8420"
    environment:
      DATABASE_URL: postgresql+asyncpg://bobb:bobb@postgres:5432/bobb
      REDIS_URL: redis://redis:6379/0
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      FAL_API_KEY: ${FAL_API_KEY:-}
      IMAGE_GEN_PROVIDER: fal
      DEBUG: "true"
      PORT: "8420"
    volumes:
      - ./cache/designs:/app/cache/designs
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8420 --workers 1"

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      # LAN deployments must override with the PC's actual LAN IP — never localhost
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://192.168.1.10:8420}
    depends_on:
      - backend

volumes:
  pgdata:
